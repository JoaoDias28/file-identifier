<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="730" viewBox="0 0 1400 730" role="img" aria-labelledby="title desc">
<title id="title">File Identifier architecture</title>
<desc id="desc">A browser sends files or URLs through Spring Cloud Gateway to the Thymeleaf frontend. The frontend calls the identifier through OpenFeign. Tika identifies MIME types and extracts text; Optimaize detects the text language. Eureka provides service registration and lookup. The frontend contains an embedded H2 database for users and roles.</desc>
